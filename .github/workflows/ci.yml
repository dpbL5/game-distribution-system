name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playport
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d playport"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/playport?schema=public
      AUTH_SECRET: ci-auth-secret-please-change
      APP_URL: http://localhost:3000
      MEDIA_ROOT: ./storage/media
      MEDIA_MAX_BYTES: 52428800
      PAYMENT_PROVIDER: mock
      PAYMENT_CALLBACK_SECRET: ci-payment-secret
      DEFAULT_CURRENCY: VND
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
